<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊盲盒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左欄是設定卡，右欄是禮物盒舞台與抽出的車票；手機上依序縱向堆疊 */
:root {
  --bg: #FBF1F3;
  --bg-glow: #F8DCE4;
  --surface: #FFFFFF;
  --surface-2: #FDF6F8;
  --ink: #3A2230;
  --muted: #86697A;
  --line: #EED9DF;
  --rose: #D24F78;
  --rose-ink: #FFFFFF;
  --rose-soft: #FBE1E9;
  --box: #F4AFC0;
  --box-lid: #EE97AD;
  --box-shade: #DD7D97;
  --ribbon: #FFF3D8;
  --ribbon-shade: #EFD9A8;
  --sea: #3A82BC;
  --mtn: #46906A;
  --city: #D2733A;
  --cult: #855FBF;
  --warn: #B4620F;
  --shadow: 0 14px 34px -16px rgba(122, 38, 70, .28);
  --f-display: "Huninn", "PingFang TC", "Noto Sans TC", sans-serif;
  --f-note: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "PingFang TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1317; --bg-glow: #34202A; --surface: #261A20; --surface-2: #2C1F26;
    --ink: #F6E7EC; --muted: #BFA1B0; --line: #3F2C35;
    --rose: #F07D9E; --rose-ink: #2A0E19; --rose-soft: #40222F;
    --box: #E592A8; --box-lid: #D87D95; --box-shade: #B4607A; --ribbon: #F7E5BD; --ribbon-shade: #D6BC86;
    --sea: #72B3E6; --mtn: #7FC69E; --city: #F2A26C; --cult: #B99BEC; --warn: #F0B261;
    --shadow: 0 14px 34px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1317; --bg-glow: #34202A; --surface: #261A20; --surface-2: #2C1F26;
  --ink: #F6E7EC; --muted: #BFA1B0; --line: #3F2C35;
  --rose: #F07D9E; --rose-ink: #2A0E19; --rose-soft: #40222F;
  --box: #E592A8; --box-lid: #D87D95; --box-shade: #B4607A; --ribbon: #F7E5BD; --ribbon-shade: #D6BC86;
  --sea: #72B3E6; --mtn: #7FC69E; --city: #F2A26C; --cult: #B99BEC; --warn: #F0B261;
  --shadow: 0 14px 34px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background:
    radial-gradient(60rem 30rem at 85% -10%, var(--bg-glow), transparent 60%),
    radial-gradient(40rem 24rem at -10% 30%, var(--bg-glow), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; border-radius: 8px; }

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- 標題 ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(34px, 7vw, 46px); line-height: 1.1; letter-spacing: .04em;
  display: flex; align-items: center; gap: 10px;
}
.brand h1 svg { width: .62em; height: .62em; color: var(--rose); flex: none; transform: translateY(-2px) rotate(-8deg); }
.brand p { margin: 0; font-family: var(--f-note); font-size: 17px; color: var(--muted); }
.today {
  font-family: var(--f-note); font-size: 15px; color: var(--muted);
  border: 1.5px dashed var(--line); border-radius: 999px; padding: 4px 14px;
  font-variant-numeric: tabular-nums;
}

.grid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- 設定卡 ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 20px;
}
@media (min-width: 861px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.field { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.label {
  font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--muted);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}

.origin { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.origin .pin { width: 36px; height: 36px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; flex: none; }
.origin .pin svg { width: 18px; height: 18px; }
.origin .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.35; }
.origin strong { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.origin .note { font-size: 12.5px; color: var(--muted); }
.link-btn { background: none; border: 0; color: var(--rose); font-weight: 700; padding: 6px 4px; flex: none; }
.link-btn:hover { text-decoration: underline; }

.origin-panel { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-md); border: 1.5px dashed var(--line); }
.origin-panel label { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 8px; min-width: 0; }
.input, .select {
  width: 100%; min-width: 0; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-size: 15px;
}
.input:focus, .select:focus { border-color: var(--rose); outline: none; box-shadow: 0 0 0 3px var(--rose-soft); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.msg { margin: 0; font-size: 13px; color: var(--rose); min-height: 0; }
.msg:empty { display: none; }
.gh-tip { margin: 0; font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; background: var(--rose-soft); }
.gh-tip a { color: var(--rose); font-weight: 700; }

.btn-ghost {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 9px 14px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn-ghost:hover { border-color: var(--rose); color: var(--rose); }
.btn-ghost svg { width: 16px; height: 16px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; border-radius: 999px; padding: 8px 10px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted);
  transition: background .2s, color .2s;
}
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-checked="true"] { background: var(--rose); color: var(--rose-ink); box-shadow: 0 4px 12px -6px var(--rose); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 13px; font-size: 14px; transition: border-color .15s, background .15s, color .15s;
  font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--rose); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); font-weight: 700; }

.custom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.custom .input { width: 84px; text-align: center; font-variant-numeric: tabular-nums; }

.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat {
  --c: var(--rose);
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md);
  border: 1.5px solid var(--line); background: var(--surface); text-align: left; min-width: 0;
  transition: border-color .15s, background .15s;
}
.cat .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.cat .ic svg { width: 18px; height: 18px; }
.cat .t { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.cat .t b { font-weight: 700; font-size: 14px; }
.cat .t small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
.cat[aria-pressed="false"] { opacity: .55; }
.cat[aria-pressed="false"] .ic { filter: grayscale(1); }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.switch .t { display: flex; flex-direction: column; line-height: 1.35; }
.switch .t b { font-weight: 500; font-size: 14.5px; }
.switch .t small { font-size: 12.5px; color: var(--muted); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + .track { background: var(--rose); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--rose); outline-offset: 2px; }

/* ---------- 舞台 ---------- */
.stage-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.stage {
  position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--box) 32%, transparent), transparent 55%),
    var(--surface);
  box-shadow: var(--shadow);
  padding-block: 28px 24px;
  padding-inline: 20px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.stage .float { position: absolute; color: var(--box); opacity: .55; animation: drift 7s ease-in-out infinite; pointer-events: none; }
.stage .float svg { width: 100%; height: 100%; }
@keyframes drift { 0%,100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-10px) rotate(calc(var(--r, 0deg) + 8deg)); } }

.pool {
  font-family: var(--f-note); font-size: 18px; text-align: center; margin: 0;
}
.pool b { font-family: var(--f-display); font-weight: 400; font-size: 30px; color: var(--rose); padding: 0 4px; font-variant-numeric: tabular-nums; }
.route-status { margin: -10px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--mtn); }
.dot.loading { background: var(--city); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* 禮物盒 */
.giftzone { position: relative; width: 220px; height: 210px; display: grid; place-items: end center; }
.glow { position: absolute; left: 50%; top: 55%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--ribbon) 90%, transparent) 0%, transparent 65%); transform: scale(0); opacity: 0; pointer-events: none; }
.gift { position: relative; width: 176px; height: 168px; background: none; border: 0; padding: 0; animation: bob 3.2s ease-in-out infinite; }
.gift:disabled { cursor: default; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.gift .shadow { position: absolute; left: 14px; right: 14px; bottom: -14px; height: 14px; border-radius: 50%; background: color-mix(in srgb, var(--box-shade) 30%, transparent); filter: blur(2px); }
.gift .body {
  position: absolute; left: 10px; right: 10px; bottom: 0; height: 108px; border-radius: 10px 10px 18px 18px;
  background: linear-gradient(90deg, var(--box-shade) 0 6%, var(--box) 6% 94%, var(--box-shade) 94%);
}
.gift .body::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 26px; margin-left: -13px; background: linear-gradient(90deg, var(--ribbon-shade) 0 18%, var(--ribbon) 18% 82%, var(--ribbon-shade) 82%); }
.gift .q { position: absolute; left: 22px; bottom: 18px; font-family: var(--f-display); font-size: 34px; line-height: 1; color: var(--ribbon); transform: rotate(-10deg); }
.gift .q2 { left: auto; right: 24px; bottom: 44px; font-size: 22px; transform: rotate(12deg); }
.gift .lid {
  position: absolute; left: 0; right: 0; top: 34px; height: 36px; border-radius: 10px;
  background: var(--box-lid); box-shadow: 0 6px 0 -2px color-mix(in srgb, var(--box-shade) 70%, transparent);
  transform-origin: 30% 100%;
}
.gift .lid::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 30px; margin-left: -15px; background: linear-gradient(90deg, var(--ribbon-shade) 0 16%, var(--ribbon) 16% 84%, var(--ribbon-shade) 84%); }
.bow { position: absolute; left: 50%; top: -30px; width: 0; height: 0; }
.bow i { position: absolute; width: 46px; height: 34px; border: 9px solid var(--ribbon); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; top: 2px; }
.bow i:first-child { right: 2px; transform: rotate(-22deg); }
.bow i:last-child { left: 2px; transform: rotate(22deg); }
.bow b { position: absolute; left: -11px; top: 16px; width: 22px; height: 18px; border-radius: 8px; background: var(--ribbon-shade); }

.gift.shake { animation: shake .9s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
  0% { transform: rotate(0); } 10% { transform: rotate(-7deg) translateY(-2px); } 20% { transform: rotate(7deg); }
  30% { transform: rotate(-9deg) translateY(-4px); } 40% { transform: rotate(9deg); } 50% { transform: rotate(-6deg); }
  60% { transform: rotate(6deg) translateY(-6px); } 70% { transform: rotate(-3deg); } 85% { transform: scale(1.06, .94); } 100% { transform: scale(1); }
}
.gift.open .lid { animation: lidoff .7s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes lidoff { to { transform: translate(-30px, -90px) rotate(-28deg); opacity: 0; } }
.giftzone.open .glow { animation: glow .9s ease-out forwards; }
@keyframes glow { 0% { transform: scale(.2); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
.gift.reset .lid { animation: lidback .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes lidback { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }

.burst { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; pointer-events: none; color: var(--c, var(--rose));
  animation: fly 1.1s cubic-bezier(.15,.7,.3,1) forwards; }
.burst svg { width: 100%; height: 100%; }
@keyframes fly { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; } }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
.btn-main {
  border: 0; border-radius: 999px; padding: 14px 30px; min-width: 200px;
  background: var(--rose); color: var(--rose-ink); font-family: var(--f-display); font-size: 19px; letter-spacing: .08em;
  box-shadow: 0 10px 22px -10px var(--rose); transition: transform .15s, box-shadow .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -10px var(--rose); }
.btn-main:active { transform: translateY(1px); }
.btn-sub {
  border: 1.5px solid var(--rose); border-radius: 999px; padding: 12px 22px; background: var(--surface);
  color: var(--rose); font-family: var(--f-display); font-size: 17px; letter-spacing: .06em;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-sub:hover { background: var(--rose-soft); }
.btn-main svg, .btn-sub svg { width: 18px; height: 18px; }
.btn-main:disabled, .btn-sub:disabled { opacity: .5; cursor: default; transform: none; }
.empty-msg { margin: 0; font-size: 14px; color: var(--rose); text-align: center; }
.empty-msg:empty { display: none; }

/* ---------- 車票 ---------- */
.results { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 16px; }
.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.results-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; text-wrap: balance; }
.results-head p { margin: 0; font-family: var(--f-note); color: var(--muted); font-size: 15px; }

.ticket {
  --c: var(--rose);
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 170px;
  background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line);
  animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both; transition: opacity .3s, transform .3s, filter .3s;
}
.ticket:nth-child(2) { animation-delay: .08s; } .ticket:nth-child(3) { animation-delay: .16s; } .ticket:nth-child(4) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.96); } to { opacity: 1; transform: none; } }
.ticket::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; border-radius: 20px 20px 0 0; background: var(--c); }
.t-main { padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.t-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--c);
  background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-radius: 999px; padding: 3px 10px 3px 8px; letter-spacing: .04em; }
.pill svg { width: 14px; height: 14px; }
.t-no { font-size: 11.5px; letter-spacing: .16em; color: var(--muted); font-variant-numeric: tabular-nums; }
.t-name { margin: 2px 0 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5vw, 32px); line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.t-place { margin: 0; font-size: 13.5px; color: var(--muted); letter-spacing: .06em; }
.t-desc { margin: 4px 0 0; font-family: var(--f-note); font-size: 17px; line-height: 1.65; max-width: 34em; }
.t-tip { margin: 2px 0 0; font-size: 13px; color: var(--warn); display: flex; gap: 6px; align-items: flex-start; }
.t-tip svg { width: 15px; height: 15px; flex: none; margin-top: 3px; }
.t-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.t-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
}
.t-btn svg { width: 15px; height: 15px; }
.t-btn:hover { border-color: var(--c); color: var(--c); }
.t-btn.primary { background: var(--c); border-color: var(--c); color: var(--surface); }
.t-btn.primary:hover { color: var(--surface); filter: brightness(1.06); }
.t-btn.done { background: color-mix(in srgb, var(--mtn) 14%, var(--surface)); border-color: var(--mtn); color: var(--mtn); }

.t-stub {
  position: relative; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 12px; justify-content: center;
  border-left: 2px dashed var(--line); background: color-mix(in srgb, var(--c) 5%, var(--surface)); border-radius: 0 20px 20px 0;
}
.t-stub::before, .t-stub::after { content: ""; position: absolute; left: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.t-stub::before { top: -12px; clip-path: inset(50% 0 0 0); }
.t-stub::after { bottom: -12px; clip-path: inset(0 0 50% 0); }
.t-stat { display: flex; flex-direction: column; line-height: 1.2; }
.t-stat span { font-size: 11.5px; letter-spacing: .16em; color: var(--muted); }
.t-stat b { font-family: var(--f-display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.t-stat b.big { color: var(--c); font-size: 26px; }
.t-src { font-size: 11.5px; color: var(--muted); }

.footprints { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px 18px; }

.footprints[open] summary .chev { transform: rotate(180deg); }
.fp-body { padding-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }

.fp-list button { border: 0; background: none; color: var(--muted); padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.fp-list button:hover { color: var(--rose); }
.fp-list button svg { width: 16px; height: 16px; }
.fp-empty { margin: 0; font-family: var(--f-note); font-size: 15px; color: var(--muted); }
.fp-foot { display: flex; justify-content: flex-end; }
.danger { color: var(--rose); }

.foot { margin-top: 30px; font-size: 12.5px; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {

<div class="wrap">
  <header class="head">
    <div class="brand">
      <h1>旅遊盲盒 <svg aria-hidden="true"><use href="#i-heart"/></svg></h1>
      <p>假日不知道去哪？打開盒子，看看今天要去哪裡。</p>
    </div>
    <span class="today" id="today"></span>
  </header>

  <div class="grid">
    <!-- 設定 -->
    <section class="panel" aria-label="抽籤設定">
      <div class="field">
        <div class="label">出發地</div>
        <div class="origin">
          <span class="pin"><svg aria-hidden="true"><use href="#i-pin"/></svg></span>
          <span class="txt"><strong id="originName">高科大楠梓校區</strong><span class="note" id="originNote">預設出發地</span></span>
          <button class="link-btn" id="originToggle" aria-expanded="false" aria-controls="originPanel">更換</button>
        </div>
        <div class="origin-panel" id="originPanel" hidden>
          <button class="btn-ghost" id="useGps"><svg aria-hidden="true"><use href="#i-gps"/></svg>使用我目前的位置</button>
          <label for="originCounty">選擇縣市與鄉鎮區</label>
          <div class="row">
            <select class="select" id="originCounty" aria-label="縣市"></select>
            <select class="select" id="originTown" aria-label="鄉鎮區"></select>
          </div>
          <label for="originPreset">常用地點</label>
          <select class="select" id="originPreset"></select>
          <label for="originCoords">或貼上座標</label>
          <div class="row">
            <input class="input" id="originCoords" inputmode="decimal" placeholder="例如 22.7263, 120.3149" autocomplete="off">
            <button class="btn-ghost" id="applyCoords">套用</button>
          </div>
          <p class="hint">在 Google 地圖上長按（電腦按右鍵）任一地點，就能複製它的座標。</p>
          <p class="msg" id="originMsg" role="status"></p>
          <p class="gh-tip" id="ghTip" hidden>想要自動定位、車程也依實際道路計算？用手機瀏覽器打開 <a id="ghLink" target="_blank" rel="noopener">GitHub 版旅遊盲盒</a>。</p>
        </div>
      </div>

      <div class="field">
        <div class="label">抽籤依據</div>
        <div class="seg" role="radiogroup" aria-label="抽籤依據">
          <button role="radio" id="modeTime" data-mode="time" aria-checked="true"><svg aria-hidden="true"><use href="#i-car"/></svg>車程</button>
          <button role="radio" id="modeDist" data-mode="dist" aria-checked="false"><svg aria-hidden="true"><use href="#i-road"/></svg>行駛距離</button>
        </div>
      </div>

      <div class="field">
        <div class="label"><span id="rangeLabel">車程範圍</span></div>
        <div class="chips" id="rangeChips" role="radiogroup" aria-label="範圍"></div>
        <div class="custom" id="customRange" hidden>
          <span>最少</span>
          <input class="input" id="customMin" type="number" min="0" step="10" inputmode="numeric" aria-label="最少">
          <span>～ 最多</span>
          <input class="input" id="customMax" type="number" min="0" step="10" inputmode="numeric" aria-label="最多" placeholder="不限">
          <span id="customUnit">分鐘</span>
        </div>
      </div>

      <div class="field">
        <div class="label">想去哪一種地方<button class="link-btn" id="catsAll" style="font-size:12px;letter-spacing:0">全選</button></div>
        <div class="cats" id="cats"></div>
      </div>

      <div class="field">
        <label class="switch" for="rain">

          <input type="checkbox" id="exVisited" checked><span class="track" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <!-- 舞台與結果 -->
    <div class="stage-col">
      <section class="stage" aria-label="盲盒">
        <span class="float" style="left:9%;top:14%;width:20px;height:20px;--r:-14deg"><svg><use href="#i-heart"/></svg></span>
        <span class="float" style="right:11%;top:22%;width:14px;height:14px;--r:12deg;animation-delay:-2s"><svg><use href="#i-heart"/></svg></span>

        <div class="giftzone" id="giftzone">
          <div class="glow"></div>
          <button class="gift" id="gift" aria-label="打開盲盒">
            <span class="shadow"></span>
            <span class="body"><span class="q">?</span><span class="q q2">?</span></span>
            <span class="lid"><span class="bow"><i></i><i></i><b></b></span></span>
          </button>
        </div>

        <div class="actions">
          <button class="btn-main" id="drawOne"><svg aria-hidden="true"><use href="#i-gift"/></svg>打開盲盒</button>
          <button class="btn-sub" id="drawThree"><svg aria-hidden="true"><use href="#i-three"/></svg>抽三選一</button>
        </div>
        <p class="empty-msg" id="emptyMsg" role="status"></p>
      </section>

      <section class="results" id="results" aria-live="polite" hidden>
        <div class="results-head"><h2 id="resultsTitle"></h2><p id="resultsSub"></p></div>
        <div class="results" id="tickets"></div>
      </section>

      <details class="footprints" id="footprints">
        <summary>
          <h2><svg aria-hidden="true"><use href="#i-steps"/></svg>我們的足跡</h2>
          <span style="display:flex;align-items:center;gap:8px"><span class="cnt" id="fpCount"></span><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></span>

        <div class="fp-body">
          <div class="bar" aria-hidden="true"><i id="fpBar" style="width:0"></i></div>
          <ul class="fp-list" id="fpList"></ul>

          <div class="fp-foot"><button class="link-btn danger" id="fpClear" hidden>清除全部紀錄</button></div>
        </div>
      </details>
    </div>
  </div>

</div>

// 恆春半島、花東與蘇花一帶的省道較慢，另外以 50 km/h 計算
const isPeninsula = (p) => p.lat < 22.42 && p.lng > 120.55;
const isSlowRoad = (p) => p === WP.sa || zoneOf(p) === "E" || isPeninsula(p);
function viaOptions(a, b, o, s) {
  if (a === b) return a === "W" && isPeninsula(o) !== isPeninsula(s) ? [[WP.fl]] : [[]];
  if (LINKS[a + b]) return LINKS[a + b];
  if (LINKS[b + a]) return LINKS[b + a].map((r) => r.slice().reverse());
  return [[]];
}
function estimate(o, s) {
  const oz = zoneOf(o);
  let best = null;
  for (const v of viaOptions(oz, s.zone, o, s)) {
    const pts = [o, ...v, s];
    let fast = 0, coast = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = hav(pts[i], pts[i + 1]), road = d * (1.2 + 0.15 * Math.exp(-d / 30));
      if (isSlowRoad(pts[i]) && isSlowRoad(pts[i + 1])) coast += road; else fast += road;
    }
    const km = fast + coast + s.slow * 0.6;
    if (!best || km < best.km) best = { km, fast, coast };
  }
  const f = Math.max(best.fast + s.slow * 0.6 - s.slow, 0);
  const h = Math.min(f, 5) / 30 + Math.min(Math.max(f - 5, 0), 15) / 55 + Math.max(f - 20, 0) / 88 + best.coast / 50 + s.slow / 32;
  return { km: best.km, min: h * 60 + 5 + (oz !== s.zone ? 10 : 0) };
}
function recomputeEstimates() {
  state.est = {};
  spots.forEach((s) => { state.est[s.name] = estimate(state.origin, s); });
}
const metric = (s) => state.routes[s.name] || state.est[s.name];

// ---------- 路線服務（OSRM，實際道路） ----------
let routeToken = 0;
async function fetchRoutes() {
  const token = ++routeToken;
  const o = state.origin;
  const cacheKey = "routes2." + o.lat.toFixed(3) + "," + o.lng.toFixed(3);
  const cached = store.get(cacheKey, null);
  if (cached && Date.now() - cached.t < 7 * 864e5 && Object.keys(cached.r).length) {
    state.routes = cached.r;
    state.routeStatus = Object.keys(cached.r).length === spots.length ? "osrm" : "partial";
    renderAll();
    return;
  }
  state.routes = {};
  state.routeStatus = "loading";
  renderAll();
  const result = {};
  const chunks = [];
  for (let i = 0; i < spots.length; i += 80) chunks.push(spots.slice(i, i + 80));
  await Promise.all(chunks.map(async (ch) => {
    const coords = [o.lng.toFixed(5) + "," + o.lat.toFixed(5)].concat(ch.map((s) => s.lng + "," + s.lat)).join(";");
    const url = "https://router.project-osrm.org/table/v1/driving/" + coords + "?sources=0&annotations=duration,distance";
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 12000);
    try {
      const res = await fetch(url, { signal: ctl.signal });
      const j = await res.json();
      if (j.code !== "Ok") return;
      ch.forEach((s, k) => {
        const dur = j.durations[0][k + 1], dis = j.distances[0][k + 1];
        // 路線服務不含路況，稍微放寬並加上停車時間
        if (dur != null && dis != null && dis > 0) result[s.name] = { min: dur / 60 * 1.05 + 3, km: dis / 1000 };
      });
    } catch (e) { /* 連不上就用估算 */ } finally { clearTimeout(timer); }
  }));
  if (token !== routeToken) return;
  const n = Object.keys(result).length;
  state.routes = result;
  state.routeStatus = n === 0 ? "est" : n === spots.length ? "osrm" : "partial";
  if (n) store.set(cacheKey, { t: Date.now(), r: result });
  renderAll();
}

// remember：手動選的出發地會記住，下次打開直接使用
function setOrigin(o, remember) {

  if (remember) store.set("origin", state.origin);
  recomputeEstimates();

function deniedText() {
  if (embedded) return "這個網址版無法使用定位，這是平台的安全限制。請用上方的縣市與鄉鎮區選單選出發地。";
  if (location.protocol === "file:") return "瀏覽器不允許本機檔案使用定位（Safari 常見）。請改用 Chrome 開啟這個檔案，或用上方選單選出發地。";
  return "定位權限沒有開啟。請在瀏覽器的網站設定裡允許「位置」，並確認手機或電腦的定位服務已開啟；也可以用上方選單選出發地。";
}
function locate(manual) {
  const msg = $("#originMsg");
  const restoreNote = () => {
    $("#originNote").textContent = state.origin.source === "default" ? "無法自動定位，使用預設出發地" : (state.origin.note || "");
  };
  if (!("geolocation" in navigator)) {
    if (manual) msg.textContent = "這個瀏覽器不支援定位，請用上方選單選出發地。";
    restoreNote();
    return;
  }
  $("#originNote").textContent = "定位中…";
  let done = false;
  const fail = (text) => {
    if (done) return; done = true;
    if (manual) { msg.textContent = text; $("#ghTip").hidden = !embedded; }
    restoreNote();
  };
  const guard = setTimeout(() => fail("等太久還沒抓到位置。請移到收訊較好的地方再試一次，或用上方選單選出發地。"), 15000);
  try {
    navigator.geolocation.getCurrentPosition((p) => {
      if (done) return; done = true; clearTimeout(guard);
      const o = { name: "我目前的位置", lat: p.coords.latitude, lng: p.coords.longitude, source: "gps", note: "已使用 GPS 定位" };
      if (!inTaiwan(o)) { if (manual) msg.textContent = "目前位置不在台灣本島，請用上方選單選出發地。"; restoreNote(); return; }
      msg.textContent = "";
      $("#originPreset").value = "";
      setOrigin(o, false);
    }, (err) => {
      clearTimeout(guard);
      fail(err && err.code === 1 ? deniedText() : "目前抓不到位置訊號。請確認定位服務已開啟、移到收訊較好的地方再試一次，或用上方選單選出發地。");
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
  } catch (e) { clearTimeout(guard); fail(deniedText()); }
}
const inTaiwan = (p) => p.lat > 21.8 && p.lat < 25.4 && p.lng > 119.9 && p.lng < 122.1;

// ---------- 篩選與抽籤 ----------
function currentRange() {
  const r = RANGES[state.mode], i = state.preset[state.mode];
  if (i >= r.presets.length) {
    const [lo, hi] = state.custom[state.mode];
    return [Number(lo) || 0, hi === "" || hi == null || isNaN(Number(hi)) ? null : Number(hi)];
  }
  return r.presets[i].slice(0, 2);
}
function inRange(s) {
  const m = metric(s), v = state.mode === "time" ? m.min : m.km;
  const [lo, hi] = currentRange();
  return v >= lo && (hi == null || v <= hi);
}
function candidates(ignoreCat) {
  return spots.filter((s) => (ignoreCat || state.cats[s.cat]) && (!state.rain || s.indoor) && !(state.exVisited && visited[s.name]) && inRange(s));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(pool, n) {
  let fresh = pool.filter((s) => !recent.includes(s.name));
  if (fresh.length < n) fresh = pool.slice();
  shuffle(fresh);
  if (n === 1) return fresh.slice(0, 1);
  const out = [];
  for (const s of fresh) { if (out.length === n) break; if (!out.some((o) => o.cat === s.cat)) out.push(s); }
  for (const s of fresh) { if (out.length === n) break; if (!out.includes(s)) out.push(s); }
  return out;
}

// ---------- 格式 ----------
function fmtMin(m) {
  const r = Math.max(5, Math.round(m / 5) * 5);
  if (r < 60) return r + " 分鐘";
  const h = Math.floor(r / 60), mm = r % 60;
  return h + " 小時" + (mm ? " " + mm + " 分" : "");
}
const fmtKm = (k) => (k < 10 ? k.toFixed(1) : Math.round(k)) + " 公里";
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()); };
const $ = (s) => document.querySelector(s);
const icon = (id) => '<svg aria-hidden="true"><use href="#' + id + '"/></svg>';

function renderFootprints() {

let lastPicks = [];

// ---------- 開盒動畫 ----------
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
function burst() {
  if (reduce) return;
  const zone = $("#giftzone");
  const colors = ["var(--rose)", "var(--box)", "var(--ribbon-shade)", "var(--sea)", "var(--cult)", "var(--city)"];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement("span");
    el.className = "burst";
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 90;
    el.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    el.style.setProperty("--dy", Math.sin(ang) * dist - 40 + "px");
    el.style.setProperty("--rot", (Math.random() * 120 - 60) + "deg");
    el.style.setProperty("--c", colors[i % colors.length]);
    const sz = 10 + Math.random() * 12;
    el.style.width = el.style.height = sz + "px";
    el.innerHTML = icon("i-heart");
    zone.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}
async function draw(n) {
  if (state.busy) return;
  const pool = candidates();
  if (!pool.length) return;
  state.busy = true; renderPool();
  const gift = $("#gift"), zone = $("#giftzone");
  gift.classList.remove("reset");
  gift.classList.add("shake");
  await wait(900);
  gift.classList.remove("shake");
  gift.classList.add("open"); zone.classList.add("open");
  burst();
  await wait(420);
  const picks = pick(pool, Math.min(n, pool.length));
  recent = picks.map((s) => s.name).concat(recent.filter((x) => !picks.some((p) => p.name === x))).slice(0, 12);
  store.set("recent", recent);
  showResults(picks, pool.length);
  if (matchMedia("(max-width: 860px)").matches) $("#results").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  await wait(900);
  gift.classList.remove("open"); zone.classList.remove("open");
  gift.classList.add("reset");
  state.busy = false; renderPool();
}

  $("#gift").addEventListener("click", () => draw(1));
  $("#drawThree").addEventListener("click", () => draw(3));

  $("#tickets").addEventListener("click", (e) => {
    const vb = e.target.closest("[data-visit]");
    if (vb) {
      const name = vb.dataset.visit;
      if (visited[name]) delete visited[name];
      else { const d = new Date(); visited[name] = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
      store.set("visited", visited);
      const v = visited[name];
      vb.classList.toggle("done", !!v);
      vb.innerHTML = icon("i-check") + (v ? "已去過・" + v.slice(5).replace("-", "/") : "我們去過了");
      renderCats(); renderPool(); renderFootprints();
      return;
    }
    const cb = e.target.closest("[data-choose]");
    if (cb) {
      const name = cb.dataset.choose;
      document.querySelectorAll("#tickets .ticket").forEach((t) => {
        t.classList.toggle("chosen", t.dataset.name === name);
        t.classList.toggle("dim", t.dataset.name !== name);
      });
      $("#resultsTitle").textContent = "就決定是 " + name + " 了！";
      $("#resultsSub").textContent = "改變心意的話，點其他車票的「選這個」";
    }
  });

  $("#fpList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-unvisit]"); if (!b) return;
    delete visited[b.dataset.unvisit]; store.set("visited", visited);
    renderAll(); syncTicketVisit();
  });
  let clearArmed = null;
  $("#fpClear").addEventListener("click", () => {
    const b = $("#fpClear");
    if (!clearArmed) {
      b.textContent = "確定要清除？再按一次";
      clearArmed = setTimeout(() => { clearArmed = null; b.textContent = "清除全部紀錄"; }, 4000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; b.textContent = "清除全部紀錄";
    visited = {}; store.set("visited", visited); renderAll(); syncTicketVisit();
  });
}
function syncTicketVisit() {
  document.querySelectorAll("[data-visit]").forEach((vb) => {
    const v = visited[vb.dataset.visit];
    vb.classList.toggle("done", !!v);
    vb.innerHTML = icon("i-check") + (v ? "已去過・" + v.slice(5).replace("-", "/") : "我們去過了");
  });
}

// ---------- 啟動 ----------
bind();
$("#foot").textContent = "共收錄 " + spots.length + " 個台灣本島景點。車程為參考值，出發前請以導航的即時路況為準。";
const savedOrigin = store.get("origin", null);
if (savedOrigin && typeof savedOrigin.lat === "number" && inTaiwan(savedOrigin)) {
  state.origin = Object.assign({}, savedOrigin, { note: savedOrigin.source === "default" ? "預設出發地" : "上次選擇的出發地" });
}
$("#originName").textContent = state.origin.name;
$("#originNote").textContent = state.origin.note;
recomputeEstimates();
renderAll();
fetchRoutes();
locate(false);
})();
</script>

</body>
</html>
